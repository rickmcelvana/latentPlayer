[package]
name = "player-core"
version.workspace = true
edition.workspace = true

[dependencies]
symphonia = { version = "0.6", features = ["mp3", "aac", "alac", "isomp4"] }
thiserror = "1"
# Real sample-rate conversion, replacing Phase 0's linear-interpolation
# stopgap. Both shells need it: a Web Audio context's rate is fixed for its
# lifetime, so the web build picks one rate per session and converts every
# track to it rather than tearing the context down between tracks.
rubato = "5"
realfft = "3.5"
# Cross-target since Phase 2: the M7 library index is native-only, but the
# Subsonic protocol (subsonic.rs) is parsed on both shells out of the same code,
# which is the whole point of keeping the protocol in Rust and the transport out
# of it (tasks/phase-2.md decision 2).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Subsonic's token auth is md5(password + salt) -- not a choice this client gets
# to make, and not used for anything else here. Pure Rust and no_std-capable, so
# it builds for wasm32 like the rest of this crate.
md-5 = "0.11"

# cpal doesn't target wasm32 -- native playback output lives behind this cfg
# and is simply absent from wasm builds (player-rt-wasm drives output via the
# Web Audio API / AudioWorklet instead, see crates/player-rt-wasm).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18"
rtrb = "0.3.4"
# The desktop shell's Subsonic transport (Phase 2 M1). Blocking, because every
# caller is a thread allowed to block and none of them is the audio callback --
# an async client would cost this crate an executor it does not otherwise have.
# rustls by default, so no OpenSSL to find on Windows. `platform-verifier` is
# M5 decision 16: without it ureq verifies against webpki-roots (Mozilla's
# bundle, compiled in), under which a self-hosted server's own CA installed in
# the OS certificate store changes nothing -- which is the norm on the boxes
# this phase exists to reach.
ureq = { version = "3.4", features = ["platform-verifier"] }
# Salts for Subsonic's token auth, from the OS. Native-only on purpose: the web
# shell has crypto.getRandomValues and this crate stays free of the wasm feature
# flag getrandom would otherwise need (tasks/phase-2.md decision 3).
getrandom = "0.3"

[dev-dependencies]

[package]
name = "player-render"
version.workspace = true
edition.workspace = true

[dependencies]
# No windowing crate here on purpose: this crate only knows how to draw into
# a wgpu Surface it's handed. The native window (src-tauri) and the web
# canvas (player-rt-wasm) are both callers, not dependencies -- that's the
# whole point of the Phase 0 "shared rendering" spike (PLAN.md §5/§8.1).
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
thiserror = "1"
# The HLSL-to-WGSL translator's output is checked by *compiling* it (Phase 3
# decision 54). wgpu does that on `create_shader_module` -- but it reports the
# result through an error scope, which is a future, and a translated preset has
# to be accepted or rejected *now* so the other pass can still be built. naga is
# wgpu's own front end, already in the lock file at the version wgpu uses, so
# calling it directly is the same acceptance taken synchronously. It is also
# what lets the corpus check thousands of shaders without a GPU device.
naga = { version = "30", features = ["wgsl-in"] }
# Decoding the image files a preset's texture pack and sprites reference
# (decision 59). PNG + JPEG only -- that is the whole of what the corpus ships
# (`png`, `jpg`, `jfif`), and no other format has to compile to wasm.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
# Only the offscreen smoke check needs to block on the async device request --
# the library itself stays async precisely so the web build never has to.
pollster = "0.4"
# The smoke check only. M2's bars draw the metering spectrum's own bands, so
# the check that a tone lights the right bar has to run the *real* analyser
# over that tone -- a hand-written levels array would only be checking itself.
# A dev-dependency, deliberately: the library still knows nothing about
# player-core, which is what keeps a visual from computing DSP (decision 2).
player-core = { path = "../player-core" }


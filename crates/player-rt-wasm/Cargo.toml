[package]
name = "player-rt-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# The web-facing glue crate: wraps player-core's decoder and
# player-render's Renderer with wasm-bindgen bindings. Neither of those two
# crates knows wasm-bindgen/web-sys exist -- this crate is where that
# knowledge lives, mirroring how src-tauri is player-render's native-side
# glue (CONVENTIONS.md).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
player-core = { path = "../player-core" }
player-render = { path = "../player-render" }
wgpu = "30"
# Phase 2 M1: the Subsonic bindings hand JSON strings across to TypeScript
# rather than structured JS objects -- two calls made when a user types a server
# address, so a serialisation dependency on the JS side would be a lot of
# machinery for nothing. player-core already parses with this.
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement"]

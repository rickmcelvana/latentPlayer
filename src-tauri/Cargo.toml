[package]
name = "app"
version.workspace = true
description = "latentPlayer desktop shell"
authors = ["latent"]
license = ""
repository.workspace = true
edition.workspace = true
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# "unstable" gates the plain (non-webview) Window/WindowBuilder API this
# crate uses to host the wgpu-rendered scope (PLAN.md §5/§8.1's native
# spike) -- verified against tauri 2.11.5's own source, not assumed.
tauri = { version = "2.11.3", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# player-render::Renderer::new is async (wasm32 needs that; see its own doc
# comment) -- src-tauri runs it on a real OS thread, so a plain block_on is
# the right tool here even though the crate itself can't assume that.
pollster = "1"

player-core = { path = "../crates/player-core" }
player-render = { path = "../crates/player-render" }
# Phase 3 M1: Esc leaves fullscreen. The visualizer window has no webview, so
# it receives no keyboard events at all -- a global shortcut is the only way a
# key reaches it. Registered *only while fullscreen is active* (and dropped on
# focus loss), so this never swallows Esc for the rest of the desktop.
tauri-plugin-global-shortcut = "2.3.2"

# Phase 2 M1: the Subsonic secret goes to the OS credential store rather than
# beside the library index, because the token scheme means this client has to
# keep the password itself (tasks/phase-2.md decision 4). Per platform, because
# keyring 4 makes the backend an explicit feature -- with none of them enabled
# it compiles and has nowhere to put anything -- and each OS wants a different
# one. `v1` is the module the classic Entry API lives in as of keyring 4.
[target.'cfg(windows)'.dependencies]
keyring = { version = "4.1", features = ["v1", "windows-native-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4.1", features = ["v1", "apple-native-keyring-store"] }

# zbus rather than dbus: pure Rust, so a Linux build needs no libdbus headers.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1", features = ["v1", "zbus-secret-service-keyring-store"] }

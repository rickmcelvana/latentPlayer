<!doctype html>
<!--
  Dev-only harness for the web build's ten-band EQ (Phase 1 M8). Served at
  /eq.html by `npm run dev`; deliberately not in vite's build inputs, so it
  never ships. The native equivalent is
  `cargo run -p player-core --example eq_smoke`, running the same checks against
  the same claims -- plus one only this side can make: that the difference
  equation in eqFilter.ts produces the same audio as the Rust one.

  A button rather than an autorun, because an AudioContext needs a user gesture
  before it will make sound.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>eq smoke</title>
    <style>
      body { background: #14161a; color: #dfe3ea; font: 13px/1.6 ui-monospace, monospace; padding: 24px; }
      button { font: inherit; padding: 6px 14px; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <p>Plays ~15s of quiet test tones on the default output, moving the EQ under them.</p>
    <button id="run">Run</button>
    <pre id="out"></pre>
    <script type="module" src="/src/eqSmoke.ts"></script>
  </body>
</html>

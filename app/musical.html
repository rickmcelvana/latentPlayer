<!doctype html>
<!--
  Dev-only harness for the web build's musical intelligence (Phase 3 M5).
  Served at /musical.html by `npm run dev`; deliberately not in vite's build
  inputs, so it never ships. The native equivalent is
  `cargo run -p player-core --example musical_smoke`, running the same checks
  against the same claims -- on the same fixtures, generated from the same
  arithmetic down to the noise bursts' random seed.

  A button rather than an autorun, because an AudioContext needs a user gesture
  before it will make sound.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>musical smoke</title>
    <style>
      body { background: #14161a; color: #dfe3ea; font: 13px/1.6 ui-monospace, monospace; padding: 24px; }
      button { font: inherit; padding: 6px 14px; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <p>
      Plays quiet click tracks, a tone and some rubato notes on the default
      output -- about a minute in all -- and reads the tempo, the beat, the
      onsets and the brightness back.
    </p>
    <button id="run">Run</button>
    <pre id="out"></pre>
    <script type="module" src="/src/musicalSmoke.ts"></script>
  </body>
</html>
